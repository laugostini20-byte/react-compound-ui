name: Publish package

# Create a GitHub Release (e.g. tag v0.2.0) to publish that version to GitHub Packages.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@laugostini20-byte'
      - run: npm ci
      - run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
