<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1342" width="2000" height="1342" role="img" aria-label="Compound">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd8cf"/>
      <stop offset="0.45" stop-color="#7fd3c6"/>
      <stop offset="1" stop-color="#3fb3a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#d9f7f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d9f7f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.9" cy="0.15" r="0.45">
      <stop offset="0" stop-color="#ffb4a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb4a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021a18" flood-opacity="0.45"/>
    </filter>
    <clipPath id="screenClip"><rect x="256" y="254" width="1494" height="840" rx="14"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="2000" height="1342" fill="#0b5952"/>
  <rect width="2000" height="1342" fill="url(#grid)"/>
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="168" fill="#ffffff" fill-opacity="0.09">
    <text x="-620" y="190" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="440" y="190" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="1500" y="190" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="2560" y="190" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="-90" y="460" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="970" y="460" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="2030" y="460" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="3090" y="460" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="-620" y="730" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="440" y="730" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="1500" y="730" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="2560" y="730" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="-90" y="1000" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="970" y="1000" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="2030" y="1000" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="3090" y="1000" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="-620" y="1270" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="440" y="1270" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="1500" y="1270" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
    <text x="2560" y="1270" textLength="960" lengthAdjust="spacingAndGlyphs">COMPOUND</text>
  </g>

  <!-- Monitor -->
  <rect x="228" y="228" width="1544" height="886" rx="26" fill="#0d1517" filter="url(#shadow)"/>
  <g clip-path="url(#screenClip)">
    <rect x="256" y="254" width="1494" height="840" fill="url(#screen)"/>
    <rect x="256" y="254" width="1494" height="840" fill="url(#glow)"/>
    <rect x="256" y="254" width="1494" height="840" fill="url(#warm)"/>
    <rect x="256" y="254" width="1494" height="840" filter="url(#grain)"/>
  </g>

  <!-- Logo: mark + wordmark, centered on the screen -->
  <g transform="translate(717 594) scale(2.6)">
    <rect x="4" y="4" width="34" height="34" rx="9" fill="#0f766e"/>
    <rect x="18" y="18" width="34" height="34" rx="9" fill="#f97360"/>
    <path d="M18 27a9 9 0 0 1 9-9h11v11a9 9 0 0 1-9 9H18z" fill="#0b4f4a"/>
  </g>
  <text x="890" y="704" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="84" font-weight="800" letter-spacing="-2">
    <tspan fill="#073b37">compound</tspan>
  </text>
</svg>
